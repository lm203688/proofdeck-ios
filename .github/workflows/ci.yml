name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Pipeline mode"
        required: true
        default: compile
        type: choice
        options:
          - compile   # build + unit tests on the simulator, no signing
          - dry_run   # build, sign, export/verify IPA and upload to TestFlight
          - release   # sign, export; App Store submit stays gated until listing materials are ready
          # inspect / prepare lanes are copied from the FollowDeck ci.yml once the
          # TestFlight/listing materials are assembled in ASC.

env:
  SCHEME: ProofDeck

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate structure & secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required paths exist
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            "project.yml" \
            "ProofDeck/Sources/ProofDeck/Info.plist" \
            "ProofDeck/Sources/ProofDeck/App/ProofDeckApp.swift" \
            "ProofDeck/Sources/ProofDeck/Models/Models.swift" \
            "ProofDeck/Sources/ProofDeck/Persistence/PersistenceController.swift" \
            "ProofDeck/Shared/WidgetSnapshot.swift" \
            "ProofDeck/Shared/ShareDraft.swift" \
            "ProofDeck/Widgets/ProofDeckWidget/ProofDeckWidget.swift" \
            "ProofDeck/Extensions/ProofDeckShare/ShareViewController.swift" \
            "README.md"; do
            test -f "$p" || { echo "Missing required path: $p"; exit 1; }
          done

      - name: Scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git \
            -e "BEGIN [A-Z ]*PRIVATE KEY" \
            -e "github_[p]at_[A-Za-z0-9_]{20,}" \
            -e "gh[p]_[A-Za-z0-9]{20,}" \
            -e "gh[o]_[A-Za-z0-9]{20,}" \
            -e "-----BEGIN" \
            ProofDeck project.yml 2>/dev/null; then
            echo "::error::Possible secret committed to source. Remove it before merging."
            exit 1
          fi
          echo "No obvious secret patterns in source."

      - name: App icon must be opaque 1024 (ITMS-90717)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          path = "ProofDeck/Sources/ProofDeck/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          data = open(path, "rb").read()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              sys.exit("::error::AppIcon is not a PNG")
          w, h, depth, ctype = struct.unpack(">IIBB", data[16:26])
          bad = []
          if ctype in (4, 6):
              bad.append(f"alpha colour type {ctype}")
          if b"tRNS" in data:
              bad.append("tRNS transparency chunk")
          if (w, h) != (1024, 1024):
              bad.append(f"size {w}x{h} != 1024x1024")
          if bad:
              sys.exit("::error::Invalid large app icon (ITMS-90717): " + ", ".join(bad))
          print(f"AppIcon OK: {w}x{h}, colour type {ctype} (no alpha)")
          PY

      - name: Validate YAML
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, yaml, sys
          ok = True
          for f in glob.glob(".github/workflows/*.yml") + ["project.yml"]:
              try:
                  yaml.safe_load(open(f, encoding="utf-8"))
                  print("valid:", f)
              except Exception as e:
                  print("invalid:", f, e); ok = False
          sys.exit(0 if ok else 1)
          PY

  macos-build:
    name: macOS build (${{ github.event.inputs.action || 'compile' }})
    # Xcode 27 toolchain: App Store Connect rejects iOS 26 SDK builds from
    # April 2027 (ITMS-90725), so shipping builds must use the iOS 27+ SDK.
    runs-on: xcode-27
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.event.inputs.action == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest usable Xcode
        run: |
          set -euo pipefail
          chosen=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::No usable Xcode toolchain. Installed:"; ls /Applications | grep -i xcode; exit 1
          fi
          echo "Selected: $chosen"
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          case "$SDK" in
            27.*|28.*|29.*) ;;
            *) echo "::error::iOS SDK $SDK is below 27.0 (ITMS-90725)."; exit 1 ;;
          esac

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version; exit 0
          fi
          if command -v brew >/dev/null 2>&1; then
            brew install xcodegen && xcodegen --version && exit 0
          fi
          mkdir -p "$RUNNER_TEMP/xcodegen" "$HOME/.local/bin"
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q -o "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          bin=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          test -n "$bin" || { echo "::error::xcodegen binary not found in release archive"; exit 1; }
          cp "$bin" "$HOME/.local/bin/xcodegen"
          chmod +x "$HOME/.local/bin/xcodegen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/xcodegen" --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick newest available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available \
            | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          if [ -z "$name" ]; then
            name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+" | sort -Vr | head -1)
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Simulator: $name"

      - name: Build for simulator (compile)
        if: github.event_name == 'push' || github.event.inputs.action == 'compile'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ProofDeck.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug \
            -quiet

      - name: Run unit tests
        if: github.event_name == 'push' || github.event.inputs.action == 'compile'
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ProofDeck.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug

      # --- Signing, archive, export and IPA verification (dry_run / release) ---
      # Route B (default): the runner only imports a pre-made .p12 + App Store
      # profiles; it never mints a distribution certificate (orphaned certs
      # consume the account limit). Material/source steps mirror the FollowDeck
      # signing-runbook §2/§5/§6/§7/§8.
      # NOTE: this lane has not been run on a real Mac yet. TestFlight upload runs
      # on dry_run; the App Store submit stays gated until listing materials are ready.
      - name: Resolve build number
        id: buildnum
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        run: |
          set -euo pipefail
          BASE=$(sed -E -n 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"([0-9]+)".*/\1/p' "$GITHUB_WORKSPACE/project.yml")
          if [ "${{ github.event.inputs.action }}" = "dry_run" ]; then
            # CI-only test segment: never collides with release builds (small
            # project.yml numbers); run_id suffix keeps repeated dry_run unique.
            BUILD=$(( BASE*100000 + (GITHUB_RUN_ID % 100000) ))
          else
            BUILD="$BASE"
          fi
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Resolved build $BUILD (base $BASE)"

      - name: Verify signing secrets (Route B)
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          PROVISIONING_PROFILE_WIDGET: ${{ secrets.PROVISIONING_PROFILE_WIDGET }}
          PROVISIONING_PROFILE_SHARE: ${{ secrets.PROVISIONING_PROFILE_SHARE }}
        run: |
          set -euo pipefail
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT DIST_CERT_P12 DIST_CERT_PASSWORD PROVISIONING_PROFILE PROVISIONING_PROFILE_WIDGET PROVISIONING_PROFILE_SHARE; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Route B signing secrets:$missing. Provision per signing-runbook.md, or switch to Route A."
            exit 1
          fi
          echo "All Route B signing secrets present."

      - name: Prepare signing material
        id: prepare
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          PROVISIONING_PROFILE_WIDGET: ${{ secrets.PROVISIONING_PROFILE_WIDGET }}
          PROVISIONING_PROFILE_SHARE: ${{ secrets.PROVISIONING_PROFILE_SHARE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"

          # ASC API key (.p8, raw PKCS8 PEM), kept on disk only for Route A
          # automatic provisioning; the TestFlight upload passes it inline.
          echo "$ASC_KEY_CONTENT" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Distribution .p12 into a throwaway keychain; partition list prevents
          # a hanging codesign prompt.
          echo "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$DIST_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$DIST_CERT_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$DIST_CERT_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # App Store profiles: main app, widget extension, share extension.
          # Each is decoded, its UUID resolved, and installed under the profiles dir.
          install_profile() {
            local b64="$1" out="$2" uuid_var="$3"
            echo "$b64" | base64 --decode > "$out"
            local uuid
            uuid=$(security cms -D -i "$out" | plutil -extract UUID raw -)
            cp "$out" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
            echo "${uuid_var}=${uuid}" >> "$GITHUB_OUTPUT"
            echo "Installed profile $uuid_var: $uuid"
          }
          install_profile "$PROVISIONING_PROFILE" "$RUNNER_TEMP/profile.mobileprovision" "profile_uuid"
          install_profile "$PROVISIONING_PROFILE_WIDGET" "$RUNNER_TEMP/profile_widget.mobileprovision" "profile_uuid_widget"
          install_profile "$PROVISIONING_PROFILE_SHARE" "$RUNNER_TEMP/profile_share.mobileprovision" "profile_uuid_share"
          echo "Prepared signing material."

      - name: Archive Release build
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild archive \
            -project ProofDeck.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ProofDeck.xcarchive" \
            DEVELOPMENT_TEAM=98KA35Y747 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ steps.buildnum.outputs.build_number }}

      - name: Export IPA (App Store)
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        env:
          PROFILE_UUID: ${{ steps.prepare.outputs.profile_uuid }}
          PROFILE_UUID_WIDGET: ${{ steps.prepare.outputs.profile_uuid_widget }}
          PROFILE_UUID_SHARE: ${{ steps.prepare.outputs.profile_uuid_share }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$PROFILE_UUID" "$PROFILE_UUID_WIDGET" "$PROFILE_UUID_SHARE" <<'PY'
          import sys, plistlib
          path, uuid, uuid_widget, uuid_share = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          data = {
              "method": "app-store",
              "teamID": "98KA35Y747",
              "compileBitcode": False,
              "provisioningProfiles": {
                  "com.lixing.proofdeck": uuid,
                  "com.lixing.proofdeck.widget": uuid_widget,
                  "com.lixing.proofdeck.share": uuid_share,
              },
          }
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ProofDeck.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          # The upload action does not expand globs: point it at the concrete IPA.
          ls -la "$RUNNER_TEMP/ipa"
          test -f "$RUNNER_TEMP/ipa/ProofDeck.ipa" || { echo "::error::ProofDeck.ipa not exported to $RUNNER_TEMP/ipa"; exit 1; }

      - name: Verify exported binary (SDK + build number + icon)
        if: contains(fromJSON('["dry_run","release"]'), github.event.inputs.action)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/unpacked/Payload/ProofDeck.app"
          rm -rf "$RUNNER_TEMP/unpacked"; mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/ipa/ProofDeck.ipa" -d "$RUNNER_TEMP/unpacked"
          test -d "$APP" || { echo "::error::No Payload/ProofDeck.app in IPA"; exit 1; }

          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist")
          SDK_NAME=$(plutil -extract DTSDKName raw "$APP/Info.plist" 2>/dev/null || echo unknown)
          echo "IPA: version $VERSION build $BUILD, $SDK_NAME"
          EXPECTED_BUILD="${{ steps.buildnum.outputs.build_number }}"
          test -n "$EXPECTED_BUILD" || { echo "::error::Resolved build number is empty"; exit 1; }
          test "$BUILD" = "$EXPECTED_BUILD" || { echo "::error::Expected build $EXPECTED_BUILD, got $BUILD"; exit 1; }
          case "$SDK_NAME" in
            iphoneos27*|iphoneos28*|iphoneos29*) ;;
            *) echo "::error::IPA was linked against $SDK_NAME (ITMS-90725 needs ios27+)"; exit 1 ;;
          esac

          # Large icon inside the bundle must be alpha-free (asset catalog output).
          python3 - "$APP" <<'PY'
          import glob, struct, sys, os
          app = sys.argv[1]
          pngs = [p for p in glob.glob(os.path.join(app, "AppIcon*.png"))] or \
                 [p for p in glob.glob(os.path.join(app, "*.png")) if "Icon" in os.path.basename(p)]
          print("icon candidates:", [os.path.basename(p) for p in pngs])
          for p in pngs:
              data = open(p, "rb").read()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  continue
              ct = struct.unpack(">IIBB", data[16:26])[3]
              if ct in (4, 6) or b"tRNS" in data:
                  sys.exit(f"::error::{os.path.basename(p)} still carries alpha (ITMS-90717)")
          print("Bundle icons: no alpha channel")
          PY

      # TestFlight upload runs on dry_run. The App Store submit stays gated:
      # listing metadata, privacy questionnaire, screenshots and availability
      # must be assembled in ASC first. This lane stops after the TestFlight upload.
      - name: Upload to TestFlight
        if: github.event.inputs.action == 'dry_run'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/ipa/ProofDeck.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_CONTENT }}
          uses-non-exempt-encryption: 'false'
          # Skip processing wait until Test Information and internal groups are
          # configured in ASC.
          wait-for-processing: 'false'

      - name: Submit for review (release only, gated)
        if: false && github.event.inputs.action == 'release'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_APP_ID: "6840349401"
        run: |
          echo "Release submit gated: listing materials not ready in ASC."
