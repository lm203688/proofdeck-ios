# XcodeGen project spec — ProofDeck starter skeleton.
# The .xcodeproj is generated on the macOS CI runner at build time; it is NOT committed.
# Docs: https://github.com/yonaskolb/XcodeGen
# Regenerate locally (macOS only): `xcodegen generate`
#
# Placeholder status: domain model and store are wired in Sources; StoreKit / ASC
# product IDs are intentionally left empty until the ASC record exists.

name: ProofDeck

options:
  bundleIdPrefix: com.lixing
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "5.0"
  ENABLE_USER_SCRIPT_SANDBOXING: YES
  DEVELOPMENT_TEAM: 98KA35Y747
  CODE_SIGN_STYLE: Automatic

targets:
  ProofDeck:
    type: application
    platform: iOS
    sources:
      - path: ProofDeck/Sources/ProofDeck
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lixing.proofdeck
      INFOPLIST_FILE: ProofDeck/Sources/ProofDeck/Info.plist
      CODE_SIGN_ENTITLEMENTS: ProofDeck/Sources/ProofDeck/ProofDeck.entitlements
      TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_STYLE: Swift

  ProofDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ProofDeck/Tests/ProofDeckTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ProofDeck

schemes:
  ProofDeck:
    build:
      targets:
        ProofDeck: [run, archive, profile]
    test:
      targets:
        - ProofDeckTests
    archive:
      config: Release
